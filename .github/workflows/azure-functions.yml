name: Build and deploy SGA backend

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: SGAFunctions
  AZURE_FUNCTIONAPP_PACKAGE_PATH: .
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --runInBand

      - name: Keep production dependencies
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: npm prune --omit=dev

      - name: Create deployment package
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          zip -r release.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "SGA_BACKEND-Nuevo/*" \
            -x "func-out.log" \
            -x "func-err.log"

      - name: Upload deployment artifact
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sga-backend
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: sga-backend

      - name: Unpack deployment artifact
        run: |
          unzip release.zip
          rm release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || secrets.AZUREAPPSERVICE_CLIENTID_F5BA3429B32F49638061383B34DB711B }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || secrets.AZUREAPPSERVICE_TENANTID_3B3241BA15654B44B90C7D57661EFBBB }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1A75B87DBC3F4BBF83972D151FE05F9A }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME || env.AZURE_FUNCTIONAPP_NAME }}
          slot-name: Production
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
